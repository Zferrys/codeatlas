            - listitem [ref=f10e880]: Future implementation swaps (e.g., different AI providers)
            - listitem [ref=f10e881]: Better separation of contract from implementation
          - 'heading "Suggestion 2: Split ScanServiceImpl" [level=3] [ref=f10e882]'
          - paragraph [ref=f10e883]:
            - strong [ref=f10e884]: Problem
            - text: ":"
            - code [ref=f10e885]: ScanServiceImpl
            - text: is the most complex class (326 lines, 8 deps). It likely violates the Single Responsibility Principle.
          - paragraph [ref=f10e886]:
            - strong [ref=f10e887]: Solution
            - text: ": Decompose into smaller services:"
          - list [ref=f10e888]:
            - listitem [ref=f10e889]:
              - code [ref=f10e890]: ScanOrchestrator
              - text: "- Coordinates the scanning process"
            - listitem [ref=f10e891]:
              - code [ref=f10e892]: CodeParser
              - text: "- Handles file parsing"
            - listitem [ref=f10e893]:
              - code [ref=f10e894]: DependencyAnalyzer
              - text: "- Builds dependency graphs"
            - listitem [ref=f10e895]:
              - code [ref=f10e896]: ScanResultBuilder
              - text: "- Assembles scan results"
          - paragraph [ref=f10e897]: This would reduce coupling and make the code more testable.
          - 'heading "Suggestion 3: Add Domain Events for Decoupling" [level=3] [ref=f10e898]'
          - paragraph [ref=f10e899]:
            - strong [ref=f10e900]: Problem
            - text: ": Services directly call each other (e.g.,"
            - code [ref=f10e901]: ScanServiceImpl
            - text: calls
            - code [ref=f10e902]: AiAnalysisService
            - text: ). This creates tight coupling.
          - paragraph [ref=f10e903]:
            - strong [ref=f10e904]: Solution
            - text: ": Introduce a domain event system:"
          - list [ref=f10e905]:
            - listitem [ref=f10e906]:
              - text: When a scan completes, publish a
              - code [ref=f10e907]: ScanCompletedEvent
            - listitem [ref=f10e908]:

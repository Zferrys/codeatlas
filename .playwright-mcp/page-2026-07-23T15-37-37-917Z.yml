            - strong [ref=f10e868]: Tradeoff
            - text: ": Risk of anemic domain model. Business rules are scattered across services rather than encapsulated in domain objects."
          - heading "6. Improvement Suggestions" [level=2] [ref=f10e869]
          - 'heading "Suggestion 1: Introduce Service Interfaces" [level=3] [ref=f10e870]'
          - paragraph [ref=f10e871]:
            - strong [ref=f10e872]: Problem
            - text: ":"
            - code [ref=f10e873]: ScanServiceImpl
            - text: has 8 dependencies and 326 lines of code. Without interfaces, testing requires mocking concrete classes.
          - paragraph [ref=f10e874]:
            - strong [ref=f10e875]: Solution
            - text: ": Extract interfaces for complex services like"
            - code [ref=f10e876]: ScanService
            - text: and
            - code [ref=f10e877]: AiAnalysisService
            - text: ". This enables:"
          - list [ref=f10e878]:

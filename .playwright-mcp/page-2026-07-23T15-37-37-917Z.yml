          - heading "5. Design Decisions & Tradeoffs" [level=2] [ref=f10e844]
          - 'heading "Decision 1: Service Implementation Classes Instead of Interfaces" [level=3] [ref=f10e845]'
          - paragraph [ref=f10e846]:
            - strong [ref=f10e847]: Decision
            - text: ": Services are concrete classes ("
            - code [ref=f10e848]: ScanServiceImpl
            - text: ","
            - code [ref=f10e849]: ProjectServiceImpl
            - text: ) rather than interfaces with implementations.
          - paragraph [ref=f10e850]:
            - strong [ref=f10e851]: Rationale
            - text: ": Simplicity and reduced boilerplate. For a project with 18 services, interfaces add overhead without immediate benefit."
          - paragraph [ref=f10e852]:
            - strong [ref=f10e853]: Tradeoff
            - text: ": Harder to mock in tests, less flexible for swapping implementations. If the project grows, this will need refactoring."
          - 'heading "Decision 2: AOP for Audit Logging" [level=3] [ref=f10e854]'
          - paragraph [ref=f10e855]:
            - strong [ref=f10e856]: Decision
            - text: ": Using"
            - code [ref=f10e857]: AuditLogAspect
            - text: to automatically log user actions.
          - paragraph [ref=f10e858]:
            - strong [ref=f10e859]: Rationale
            - text: ": Clean separation of cross-cutting concerns. Developers don't need to manually add logging code to every method."
          - paragraph [ref=f10e860]:
            - strong [ref=f10e861]: Tradeoff
            - text: ": Debugging can be harder (magic behavior). Performance overhead from AOP proxies."
          - 'heading "Decision 3: Thin Domain Layer" [level=3] [ref=f10e862]'
          - paragraph [ref=f10e863]:

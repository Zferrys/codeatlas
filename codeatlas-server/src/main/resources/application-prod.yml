# =============================================================
# CodeAtlas 生产环境配置
# 使用方式: java -jar app.jar --spring.profiles.active=prod
# 或设置环境变量: SPRING_PROFILES_ACTIVE=prod
# =============================================================

# ---- Knife4j / Swagger（生产环境关闭） ----
knife4j:
  enable: false

# ---- Actuator（生产环境仅暴露 health） ----
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# ---- MyBatis SQL 日志（生产环境关闭） ----
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

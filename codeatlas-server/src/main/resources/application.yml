server:
  port: 8080
  shutdown: graceful

spring:
  profiles:
    active: dev
  application:
    name: codeatlas
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # ---- DataSource / MySQL ----
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/codeatlas?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: "${DB_USERNAME:root}"
    password: "${MYSQL_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 5000
      max-lifetime: 1800000

  # ---- Flyway ----
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    table: flyway_schema_history
    validate-on-migrate: true

  # ---- Neo4j ----
  neo4j:
    uri: "${NEO4J_URI:bolt://localhost:7687}"
    authentication:
      username: "${NEO4J_USERNAME:neo4j}"
      password: "${NEO4J_PASSWORD}"
    pool:
      metrics-enabled: true

  # ---- Neo4j Data ----
  data:
    neo4j:
      transaction-manager-name: neo4jTransactionManager

  # ---- Redis ----
  redis:
    host: "${REDIS_HOST:127.0.0.1}"
    port: "${REDIS_PORT:6379}"
    password: "${REDIS_PASSWORD:}"
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  # ---- File Upload ----
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# ---- MyBatis ----
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.codeatlas.server.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ---- Actuator ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    neo4j:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: codeatlas

# ---- Knife4j (Swagger) ----
knife4j:
  enable: true
  setting:
    language: zh-CN

# ---- CodeAtlas 业务配置 ----
codeatlas:
  ai:
    primary: claude
    clients:
      claude:
        base-url: https://api.anthropic.com
        model: claude-sonnet-4-6
        max-tokens: 4096
        temperature: 0.3
      deepseek:
        base-url: https://api.deepseek.com
        model: deepseek-chat
        max-tokens: 4096
        temperature: 0.3
  analysis:
    max-file-size: 10485760
    max-project-size: 524288000
    timeout-minutes: 30
    max-dependency-depth: 10
    max-concurrent-scans: 3
  security:
    jwt:
      secret: "${CODEATLAS_JWT_SECRET:}"
      expiration-hours: 4
    rate-limit:
      enabled: true
      default-rps: 10
  alert:
    webhook-url: "${CODEATLAS_ALERT_WEBHOOK_URL:}"
  workspace:
    dir: ./codeatlas-workspace
    retention-hours: 24
    cleanup-interval-ms: 3600000

# ---- Resilience4j 熔断 + 重试 + 隔离 ----
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 30s
        slow-call-rate-threshold: 50
    instances:
      aiClient:
        base-config: default
        minimum-number-of-calls: 5
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
    instances:
      aiClient:
        base-config: default
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 3
        max-wait-duration: 10s
    instances:
      aiClient:
        base-config: default

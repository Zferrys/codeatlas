name: CodeAtlas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI 专用密码仅用于临时测试容器，非生产环境凭据
env:
  CI_MYSQL_PASSWORD: codeatlas

jobs:
  backend-build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.CI_MYSQL_PASSWORD }}
          MYSQL_DATABASE: codeatlas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Code Quality Check
        run: mvn compile checkstyle:check pmd:check

      - name: Unit Tests
        run: mvn test -pl codeatlas-server,codeatlas-engine,codeatlas-common

      - name: JaCoCo Coverage Check
        run: mvn jacoco:check -pl codeatlas-server

  flyway-validation:
    runs-on: ubuntu-latest
    needs: backend-build

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.CI_MYSQL_PASSWORD }}
          MYSQL_DATABASE: codeatlas
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Validate Flyway Migrations
        run: mvn flyway:validate -pl codeatlas-server -Dflyway.url=jdbc:mysql://127.0.0.1:3306/codeatlas -Dflyway.user=root -Dflyway.password="$CI_MYSQL_PASSWORD"
        env:
          CI_MYSQL_PASSWORD: ${{ env.CI_MYSQL_PASSWORD }}

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: codeatlas-web/package-lock.json

      - name: Install & Build
        working-directory: codeatlas-web
        run: |
          npm ci
          npm run build

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: OWASP Dependency Check
        run: mvn dependency-check:check -pl codeatlas-server

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: codeatlas:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

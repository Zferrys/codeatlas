name: CodeAtlas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI 专用密码仅用于临时测试容器，非生产环境凭据
env:
  CI_MYSQL_PASSWORD: codeatlas

jobs:
  backend-build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.CI_MYSQL_PASSWORD }}
          MYSQL_DATABASE: codeatlas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ReportService 生成 PDF 依赖系统 CJK 字体（按路径探测 NotoSansCJK）；
      # runner 缺中文字体时回退 Helvetica，5 个 ReportServiceTest 的中文提取断言必挂
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Code Quality Check
        run: mvn compile checkstyle:check pmd:check

      - name: Unit Tests
        run: mvn test -pl codeatlas-server,codeatlas-engine,codeatlas-common

      - name: JaCoCo Coverage Check
        run: mvn jacoco:check -pl codeatlas-server

  flyway-validation:
    runs-on: ubuntu-latest
    needs: backend-build

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.CI_MYSQL_PASSWORD }}
          MYSQL_DATABASE: codeatlas
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Validate Flyway Migrations
        # flyway 目标需解析 server 的项目依赖（构建迁移 classpath），而全新 runner 的 ~/.m2 没有同仓 SNAPSHOT → 先全量安装同仓模块
        run: |
          mvn install -DskipTests
          mvn flyway:migrate flyway:validate -pl codeatlas-server -Dflyway.url=jdbc:mysql://127.0.0.1:3306/codeatlas -Dflyway.user=root -Dflyway.password="$CI_MYSQL_PASSWORD"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: codeatlas-web/package-lock.json

      - name: Install Dependencies
        working-directory: codeatlas-web
        run: npm ci

      # 前端 vitest 全量套件此前未接入 CI，回归只能靠本地；接线后与构建同 job 拦截
      - name: Frontend Unit Tests
        working-directory: codeatlas-web
        run: npm test

      - name: Build
        working-directory: codeatlas-web
        run: npm run build

  dependency-check:
    runs-on: ubuntu-latest
    # NVD 库下载慢且无 API key 易限流，新 CVE 会随机刷红无代码变更的提交 → 扫描照跑但不拦门
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: OWASP Dependency Check
        run: mvn install -DskipTests dependency-check:check

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: codeatlas:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
